<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#1e1e2e" />
  <title>Home</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="shortcut icon" href="./favicon.svg" />

  <style>
    :root {
      /* Catppuccin Mocha */
      --rosewater: #f5e0dc;
      --flamingo: #f2cdcd;
      --pink: #f5c2e7;
      --mauve: #cba6f7;
      --red: #f38ba8;
      --maroon: #eba0ac;
      --peach: #fab387;
      --yellow: #f9e2af;
      --green: #a6e3a1;
      --teal: #94e2d5;
      --sky: #89dceb;
      --sapphire: #74c7ec;
      --blue: #89b4fa;
      --lavender: #b4befe;

      --text: #cdd6f4;
      --subtext1: #bac2de;
      --subtext0: #a6adc8;
      --overlay2: #9399b2;
      --overlay1: #7f849c;
      --overlay0: #6c7086;
      --surface2: #585b70;
      --surface1: #45475a;
      --surface0: #313244;
      --base: #1e1e2e;
      --mantle: #181825;
      --crust: #11111b;

      --card: rgba(49, 50, 68, 0.72);
      --card-hover: rgba(69, 71, 90, 0.86);
      --border: rgba(205, 214, 244, 0.08);
      --shadow: 0 18px 60px rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--base);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(203, 166, 247, 0.10), transparent 30%),
        radial-gradient(circle at 80% 75%, rgba(137, 180, 250, 0.08), transparent 34%),
        linear-gradient(145deg, var(--crust), var(--base) 42%, var(--mantle));
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.25;
      background-image:
        linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: linear-gradient(to bottom, transparent, black 18%, black 82%, transparent);
    }

    main {
      width: min(900px, calc(100% - 32px));
      padding: 48px 0;
      animation: appear 520ms ease-out both;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .top {
      text-align: center;
      margin-bottom: 30px;
    }

    #clock {
      margin: 0;
      font-size: clamp(4.2rem, 12vw, 7.5rem);
      line-height: 0.95;
      font-weight: 750;
      letter-spacing: -0.075em;
      color: var(--mauve);
      text-shadow: 0 8px 40px rgba(203, 166, 247, 0.12);
    }

    #date {
      margin-top: 14px;
      color: var(--subtext0);
      font-size: 0.98rem;
      text-transform: capitalize;
    }

    #greeting {
      margin: 12px auto 0;
      max-width: 620px;
      color: var(--subtext1);
      font-size: 0.92rem;
      line-height: 1.5;
      opacity: 0.88;
    }

    .search-wrap {
      position: relative;
      max-width: 660px;
      margin: 0 auto 34px;
    }

    .search-wrap svg {
      position: absolute;
      left: 17px;
      top: 50%;
      width: 20px;
      height: 20px;
      transform: translateY(-50%);
      color: var(--overlay1);
      pointer-events: none;
    }

    #search {
      width: 100%;
      height: 56px;
      border: 1px solid var(--border);
      border-radius: 16px;
      outline: none;
      background: rgba(24, 24, 37, 0.72);
      color: var(--text);
      padding: 0 50px 0 48px;
      font-size: 1rem;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      transition:
        border-color 150ms ease,
        background 150ms ease,
        box-shadow 150ms ease,
        transform 150ms ease;
    }

    #search::placeholder {
      color: var(--overlay0);
    }

    #search:focus {
      border-color: rgba(203, 166, 247, 0.48);
      background: rgba(30, 30, 46, 0.94);
      box-shadow:
        0 0 0 4px rgba(203, 166, 247, 0.08),
        0 18px 60px rgba(0, 0, 0, 0.30);
      transform: translateY(-1px);
    }

    .search-hint {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--overlay0);
      font-size: 0.74rem;
      border: 1px solid rgba(205, 214, 244, 0.08);
      background: var(--surface0);
      border-radius: 7px;
      padding: 4px 7px;
      user-select: none;
    }


    .link-section {
      margin-top: 24px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 12px 2px;
      color: var(--subtext0);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(
        90deg,
        rgba(205, 214, 244, 0.10),
        transparent
      );
    }

    .shortcuts {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .shortcut {
      --accent: var(--blue);
      position: relative;
      min-height: 124px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 12px 38px rgba(0, 0, 0, 0.14);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition:
        transform 160ms ease,
        background 160ms ease,
        border-color 160ms ease,
        box-shadow 160ms ease;
    }

    .shortcut::after {
      content: "";
      position: absolute;
      width: 70px;
      height: 70px;
      top: -34px;
      right: -18px;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.08;
      filter: blur(2px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .shortcut:hover,
    .shortcut:focus-visible {
      transform: translateY(-4px);
      background: var(--card-hover);
      border-color: color-mix(in srgb, var(--accent) 35%, transparent);
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.22);
      outline: none;
    }

    .shortcut:hover::after,
    .shortcut:focus-visible::after {
      opacity: 0.15;
      transform: scale(1.25);
    }

    .icon-wrap {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: color-mix(in srgb, var(--accent) 13%, var(--surface0));
      color: var(--accent);
    }

    .icon-wrap svg {
      width: 23px;
      height: 23px;
      fill: currentColor;
    }

    .shortcut span {
      color: var(--subtext1);
      font-size: 0.92rem;
      font-weight: 640;
      letter-spacing: 0.01em;
    }

    footer {
      margin-top: 26px;
      text-align: center;
      color: var(--overlay0);
      font-size: 0.78rem;
      opacity: 0.8;
    }

    footer b {
      color: var(--lavender);
      font-weight: 600;
    }

    @media (max-width: 720px) {
      main {
        width: min(620px, calc(100% - 24px));
        padding: 32px 0;
      }

      .shortcuts {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .link-section {
        margin-top: 20px;
      }

      .shortcut {
        min-height: 112px;
      }
    }

    @media (max-width: 390px) {
      .shortcuts {
        gap: 10px;
      }

      .shortcut {
        min-height: 102px;
      }

      #search {
        border-radius: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

  <script>
    const clock = document.querySelector("#clock");
    const date = document.querySelector("#date");
    const greeting = document.querySelector("#greeting");
    const search = document.querySelector("#search");
    const searchForm = document.querySelector("#search-form");


    const greetings = [
      "Bom te ver por aqui :D",
      "Hora de criar alguma coisa bonita.",
      "Um projeto de cada vez.",
      "Qual vai ser a ideia de hoje?",
      "Bem-vindo de volta.",
      "Abra uma aba. Comece alguma coisa.",
      "Talvez hoje saia aquela ideia que estava faltando.",
      "Tudo pronto. Só escolher pra onde ir.",
      "Mais um dia, mais uma coisa pra inventar.",
      "Sem pressa. A página inicial já está pronta.",
      "O PC está acordado. Agora é com você.",
      "Catppuccin torna tudo 17% mais confortável. Fonte: confia."
    ];

    greeting.textContent =
      greetings[Math.floor(Math.random() * greetings.length)];

    function updateClock() {
      const now = new Date();

      clock.textContent = new Intl.DateTimeFormat("pt-BR", {
        timeZone: "America/Manaus",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(now);

      date.textContent = new Intl.DateTimeFormat("pt-BR", {
        timeZone: "America/Manaus",
        weekday: "long",
        day: "2-digit",
        month: "long"
      }).format(now);
    }

    updateClock();
    setInterval(updateClock, 1000);

    // Troque a URL abaixo se quiser usar outro mecanismo de pesquisa.
    const SEARCH_URL = "https://www.startpage.com/sp/search?query=";

    searchForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const query = search.value.trim();

      if (!query) return;

      // Se a pessoa digitou uma URL, abre diretamente.
      if (/^(https?:\/\/|www\.)/i.test(query)) {
        const url = query.startsWith("http") ? query : `https://${query}`;
        window.location.href = url;
        return;
      }

      window.location.href = SEARCH_URL + encodeURIComponent(query);
    });

    document.addEventListener("keydown", (event) => {
      if (
        event.key === "/" &&
        document.activeElement !== search
      ) {
        event.preventDefault();
        search.focus();
      }

      if (event.key === "Escape" && document.activeElement === search) {
        search.blur();
      }
    });
  </script>
</body>
</html>
